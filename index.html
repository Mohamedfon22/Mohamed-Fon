<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOHAMED FON</title><link rel="stylesheet" href="/styles.css"></head><body>
<header><div class="brand">MOHAMED <b>FON</b></div><nav><a href="#products">المنتجات</a><a href="#maintenance">الصيانة</a><a href="#admin">الإدارة</a></nav><a class="cart" href="#cart">السلة <span id="cartCount">0</span></a></header>
<section class="hero"><small>متجر الهواتف والإكسسوارات</small><h1>كل ما تحتاجه<br><em>في مكان واحد</em></h1><p>منتجات مميزة وخدمة صيانة موثوقة</p><a class="btn" href="#products">تصفح المنتجات</a></section>
<main><section id="products"><h2>أحدث المنتجات</h2><div id="productGrid" class="grid">جارٍ تحميل المنتجات...</div></section>
<section id="cart" class="panel"><h2>سلة المشتريات</h2><div id="cartItems">السلة فارغة</div><form id="orderForm" class="form"><input name="name" placeholder="الاسم بالكامل" required><input name="phone" placeholder="رقم الهاتف" required><input name="governorate" placeholder="المحافظة"><input name="city" placeholder="المنطقة / المدينة"><input class="wide" name="address" placeholder="العنوان التفصيلي"><textarea class="wide" name="notes" placeholder="ملاحظات"></textarea><button class="btn wide">تأكيد الطلب عبر واتساب</button></form></section>
<section id="maintenance" class="panel"><h2>طلب صيانة</h2><form id="maintenanceForm" class="form"><input name="name" placeholder="الاسم بالكامل" required><input name="phone" placeholder="رقم التواصل" required><input class="wide" name="device_type" placeholder="نوع الجهاز" required><textarea class="wide" name="issue" placeholder="وصف الأعطال" required></textarea><button class="btn wide">إرسال طلب الصيانة عبر واتساب</button></form></section>
<section id="admin" class="panel"><h2>لوحة الإدارة</h2><form id="loginForm" class="form"><input class="wide" type="password" id="adminPassword" placeholder="كلمة مرور الإدارة"><button class="btn wide">دخول الإدارة</button></form><div id="adminPanel" hidden><h3>إضافة منتج</h3><form id="productForm" class="form"><input name="name" placeholder="اسم المنتج" required><input name="price" type="number" min="0" placeholder="السعر" required><input name="category" placeholder="التصنيف"><input name="image_url" placeholder="رابط صورة المنتج"><textarea class="wide" name="description" placeholder="التفاصيل والمميزات"></textarea><button class="btn wide">إضافة المنتج</button></form><h3>طلبات الصيانة</h3><div id="maintenanceList"></div></div></section></main><footer>© MOHAMED FON</footer><script src="/app.js"></script></body></html>
